# Inserts the plugin configured for this workspace. `profile` names the
# ~/.databrickscfg entry whose workspace receives the traces, and
# `experimentId` pins the MLflow experiment directly so no name lookup happens.
# Change both if you point this at another workspace.
- insert:
    - id: databricks-mlflow-tracing
      name: '@local/dsh-databricks-mlflow-tracing'
      config:
        profile: fevm-workshop-guy
        experimentId: "1893648886440436"
        experiment: dsh-conversations
